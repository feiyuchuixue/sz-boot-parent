# 数据库类型，默认为mysql，可选项：mysql、postgresql，根据实际使用的数据库类型进行配置。
DB_TYPE: mysql
spring:
  threads:
    virtual:
      # 启用虚拟线程
      enabled: true
  profiles:
    active: local
  config:
    import:
      - file:config/${spring.profiles.active}/knife4j.yml
      - file:config/${spring.profiles.active}/audit-log.yml
      - file:config/${spring.profiles.active}/oss.yml
      - file:config/${spring.profiles.active}/mybatis-flex.yml
      - file:config/${spring.profiles.active}/${DB_TYPE}.yml
      - file:config/${spring.profiles.active}/page-helper.yml
      - file:config/${spring.profiles.active}/redis.yml
      - file:config/${spring.profiles.active}/sa-token.yml
  mvc:
    path-match:
      matching-strategy: ant_path_matcher
  application:
    name: admin-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
app:
  version: '@project.version@'
sz:
  api-prefix:
    modules:
      admin:
        enabled: true
        prefix: /admin
      audit:
        enabled: true
        prefix: /audit
      generator:
        enabled: true
        prefix: /generator
  # 是否启用数据权限拼接
  data-scope:
    enabled: true
    # 推荐 user 或 dept。仅精确 user 使用创建者及其部门关系；其他字符串使用 dept_scope 部门模式。
    logic-min-unit: user
    # 有实际部门过滤时，true 额外放行超管创建的数据，false 排除它；仅本人分支不受影响，全部数据规则直接放行。
    allow-admin-view: false
  debounce:
    # 是否启用防抖功能
    enabled: true
    # 全局防抖时间，单位毫秒（默认1000ms）
    global-lock-time: 500
    # 是否忽略未标注 @Debounce 的 GET 请求；@DebounceIgnore 始终跳过。
    ignore-get-method: true
  # 生成工具
  generator:
    path:
      # 前端项目地址
      web:
      # 后端项目地址，默认自动检测springboot项目路径，无需配置。
      api:
    # 模块名，指定代码生成的模块
    module-name: sz-module
    service-name: sz-module-admin
    global:
      author: sz-admin
      packages: com.sz.admin
      ignore-table-prefix:
        enabled: true
        prefixes:
          - t_
  # 微信生态
  wechat:
    # 小程序
    mini:
      app-id: your_app_id
      app-secret: your_app_secret
  cors:
    # 允许的完整 Origin（协议、主机及可选端口）；精确 * 允许任意 Origin，空列表不放行跨域请求。
    allowed-origins:
      - "*"
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "never"
