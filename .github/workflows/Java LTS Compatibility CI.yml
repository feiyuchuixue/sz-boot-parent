name: Java LTS Compatibility CI

on:
  push:
    branches: [ "main", "dev", "preview", "test" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: JDK ${{ matrix.java }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "21", "25" ]
        database: [ mysql, postgresql ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Maven 3.9.6
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Verify with ${{ matrix.database }} profile
        run: mvn clean verify -DskipTests=false -DskipITs=false -P${{ matrix.database }}

      - name: Enforce Java 21 bytecode baseline
        run: bash .github/scripts/check-java-class-version.sh 65
