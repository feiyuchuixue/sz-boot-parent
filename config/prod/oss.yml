# $schema: ../../schemas/config/oss.schema.json
sz:
  # OSS 默认连接配置
  oss:
    # 存储厂商类型，支持 MINIO、RUSTFS、ALIYUN、TENCENT、QINIU；未显式指定寻址风格时按生效 provider 决定默认值。
    provider: MINIO
    # S3 寻址方式：PATH 把 bucket 放在 URL 路径中；VIRTUAL_HOSTED 把 bucket 放在主机名前。
    addressing-style: PATH
    # S3 兼容 API 端点，供 SDK 请求和预签名使用；所有厂商均支持完整 HTTP(S) 地址，也兼容主机名或主机名加端口。
    # 去除首尾空白和末尾斜杠；未带协议时使用 scheme（默认 https），已带协议时沿用 endpoint 自身协议。
    # scheme 不覆盖 endpoint 自身协议，但仍用于未带协议的 domain；未配 domain 时 DIRECT URL 沿用生效 endpoint 的协议。
    endpoint: http://192.168.100.176:9000
    # accessKey 是访问密钥 ID；secretKey 是配对的访问密钥 Secret。
    accessKey: 05balQ9A7aJYUwH8NOt1
    secretKey: YMhKoRbfHEgl3eDM2gDlu3hFSmBnB0cKZY2AzCrc
    # OSS scene 未单独指定 bucket 时使用的默认桶。
    bucketName: test
  # 业务资源场景配置
  resource:
    # LOCAL 存储的磁盘根目录，文件物理路径为 root/objectKey，objectKey 以场景 path 为前缀。
    root: ./data
    # 开发辅助文件服务在本环境默认关闭，不创建 Controller 和路由；显式改为 true 会启用。
    # 生产环境建议保持关闭，使用 Nginx 静态资源服务。
    dev-file-server:
      enabled: false
    security:
      # 全局允许上传的扩展名白名单；scene.exts 只能在此范围内进一步收窄。
      allowed-exts: [jpg, jpeg, png, gif, bmp, webp, svg, ico, pdf, doc, docx, xls, xlsx, ppt, pptx, rtf, txt, csv, zip, rar, 7z, tar, gz, mp3, wav, ogg, mp4, mov, avi, wmv]
      # 全局单文件大小上限，使用与场景相同的 DataSize 格式（如 50MB、512KB、1GB）；未配时默认 50MB。
      # 两处均建议显式写单位，支持 B/KB/MB/GB/TB；未带单位的数字均按字节解析。
      max-size: 50MB
    # scene 通用字段：
    # code 是唯一标识，与上传参数 sceneCode 对应；name 是可选展示名称，默认使用 code。
    # type 支持 LOCAL/OSS，默认 LOCAL；serve-mode 默认 PROTECTED，由调用方完成业务鉴权后经业务接口读取。
    # DIRECT 显式公开：本部署环境的 LOCAL 由实际 Nginx 等静态服务承载；OSS 需桶的公开读取权限或公开代理。
    # PRESIGNED 仅用于 OSS，通过 SDK 生成临时签名地址；expire 单位为秒，默认 3600 且必须大于 0，仅此模式生效。
    # path 仅 LOCAL 使用，是相对 resource.root 的存储目录，也是 objectKey 前缀；不会自动追加到显式 base-url。
    # DIRECT base-url 支持完整 HTTP(S) 前缀或 / 开头的同源路径，优先级相同；同源路径按浏览器当前协议、域名和端口访问，需配套路由或代理。
    # 显式 base-url 直接使用，不补 endpoint、bucket 或 path；只追加 objectKey 去掉场景前缀后的相对文件路径，建议前缀不以 / 结尾。
    # PROTECTED 不生成公开访问 URL，下载/预览由业务接口提供；PROTECTED 和 PRESIGNED 均不使用 base-url。
    # LOCAL DIRECT 必须显式填写 base-url，不继承 sz.oss；OSS DIRECT 未填写时，默认连接优先用全局 domain，否则由 endpoint 推导。
    # 独立 OSS 连接不继承全局 domain，未显式填写 base-url 时按自身 endpoint、生效 bucket 和寻址风格推导。
    # 全局 domain 在 PATH 模式填写不含桶的访问根地址；VIRTUAL_HOSTED 模式填写桶完整地址或 {bucket} 模板。
    # domain 仅参与默认连接的 DIRECT URL 推导，不参与 SDK 请求或预签名；完整 HTTP(S) 地址沿用自身协议，未带协议时使用全局 scheme。
    # OSS scene 的 bucket、provider、region 优先，未配置时继承全局；bucket 也是逻辑 objectKey 前缀，SDK 写入时剥离该前缀。
    # 寻址风格优先级：scene.addressing-style > 全局 addressing-style > 全局 force-path-style > 生效 provider 的默认值。
    # 全局 addressing-style 与旧 force-path-style 同时配置时必须一致；均未配置时 MINIO/RUSTFS 默认 PATH，其他厂商默认 VIRTUAL_HOSTED。
    # region 是 S3 签名区域，缺省为 us-east-1；应与目标服务及桶所在地域匹配，仅修改 region 或 provider 不会切换 endpoint。
    # scene 顶层的 endpoint、access-key、secret-key 任一项出现即视为独立连接，必须三项均非空；三项均未配置则继承全局端点和凭据。
    # provider 和 region 可单独覆盖；bucket 不参与客户端缓存标识，同一连接配置和寻址风格的场景可复用客户端，连接配置变更需重启应用。
    # naming 默认 UUID；ORIGINAL 清洗原文件名，已存在时追加毫秒时间戳；BIZ_KEY 按业务标识命名，同一路径可覆盖；TIMESTAMP 按时间戳命名。
    # path-strategy 对 LOCAL/OSS 都生效，默认 FLAT；DATE 按 yyyyMMdd 分层，BIZ 按 pathSegments 分层，BIZ_DATE 先业务层级后日期。
    # exts 非空时与全局 allowed-exts 取交集，未配或为空不额外限制，仍执行危险扩展名黑名单和全局白名单校验。
    # mimes 非空时优先使用场景 MIME 白名单，未配或为空时使用全局 MIME 白名单；客户端未提供 MIME 时跳过此项校验。
    # 场景单文件大小上限，使用与全局相同的 DataSize 格式（如 10MB、512KB、1GB）；正数时与全局上限取较小值。
    # 未配或小于等于 0B 时不添加场景上限，仍受全局限制；旧场景整数 MB 配置须补写单位，例如 10 改为 10MB。
    # 本文件的 /resource/* 同源路径由生产环境 Nginx 公开目录白名单承载。
    scenes:
      # ========= 账户头像 - LOCAL DIRECT =========
      - code: admin.user.logo # 账户头像
        name: 账户头像
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/logo # 生产环境由 Nginx 公开目录白名单承载
        path: logo
        naming: ORIGINAL
        path-strategy: BIZ_DATE
        exts: [svg, png, jpg, jpeg, webp, gif]
        max-size: 3MB
      # ========= 账户头像 - OSS PRESIGNED（临时签名访问，无需 base-url） =========
      #      - code: admin.user.logo # 账户头像
      #        type: OSS
      #        serve-mode: PRESIGNED
      #        bucket: client-logos
      #        # PRESIGNED 使用 endpoint 生成临时签名地址，无需 base-url
      #        naming: ORIGINAL
      #        path-strategy: BIZ_DATE
      #        exts: [svg, png, jpg, jpeg, webp, gif]
      #        max-size: 3MB
      # ========= 账户头像 - OSS DIRECT（公开访问） =========
      #      - code: admin.user.logo # 账户头像
      #        type: OSS
      #        serve-mode: DIRECT
      #        bucket: client-logos-public
      #        base-url: http://192.168.100.176:9000/client-logos-public # oss（minio）服务地址
      #        naming: UUID
      #        path-strategy: BIZ_DATE
      #        exts: [ svg, png, jpg, jpeg, webp, gif ]
      #        max-size: 3MB
      # ========= 模板文件 - LOCAL PROTECTED（经业务接口下载/预览，无需 base-url） =========
      - code: template.excel
        name: 模板文件管理 / 导入模板
        type: LOCAL
        serve-mode: PROTECTED
        path: template
        naming: ORIGINAL
        path-strategy: DATE
        exts: [ xls, xlsx ]
        max-size: 10MB
      # ========= 教师统计 - 附件 - LOCAL PROTECTED（经业务接口下载/预览，无需 base-url） =========
      - code: teacher.attachment
        name: 教师统计 / 附件
        type: LOCAL
        serve-mode: PROTECTED
        path: teacher-attachments
        naming: ORIGINAL
        path-strategy: BIZ_DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 10MB
      # ========= 教师统计 - 富文本编辑器 - LOCAL DIRECT（同源公开访问） =========
      - code: teacher.richtext
        name: 教师富文本
        type: LOCAL
        serve-mode: DIRECT
        path: teacher-richtext
        base-url: /resource/teacher-richtext
        naming: UUID
        path-strategy: DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 5MB
      # ========= 临时公开文件 - LOCAL DIRECT（保留旧场景兼容） =========
      - code: system.temp
        name: 临时公开文件
        type: LOCAL
        serve-mode: DIRECT
        path: temp
        base-url: /resource/temp
        naming: ORIGINAL
        path-strategy: DATE
        exts: [ png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx ]
        max-size: 10MB
      # ========= 通用上传组件 / 代码生成器默认受保护附件 - LOCAL PROTECTED =========
      - code: system.protected
        name: 通用业务附件
        type: LOCAL
        serve-mode: PROTECTED
        path: protected
        naming: ORIGINAL
        path-strategy: DATE
        exts: [ png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx ]
        max-size: 10MB
      # ========= 富文本组件默认公开资源 =========
      - code: system.richtext
        name: 通用富文本资源
        type: LOCAL
        serve-mode: DIRECT
        path: richtext
        base-url: /resource/richtext
        naming: UUID
        path-strategy: DATE
        exts: [ png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx ]
        max-size: 5MB
