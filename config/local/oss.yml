# $schema: ../../schemas/config/oss.schema.json
sz:
  # OSS 默认连接配置
  oss:
    # 存储厂商类型，支持 MINIO、RUSTFS、ALIYUN、TENCENT、QINIU；未显式指定寻址风格时按生效 provider 决定默认值。
    provider: RUSTFS
    # S3 寻址方式：PATH 把 bucket 放在 URL 路径中；VIRTUAL_HOSTED 把 bucket 放在主机名前。
    addressing-style: PATH
    # S3 兼容 API 端点，供 SDK 请求和预签名使用；所有厂商均支持完整 HTTP(S) 地址，也兼容主机名或主机名加端口。
    # 去除首尾空白和末尾斜杠；未带协议时使用 scheme（默认 https），已带协议时沿用 endpoint 自身协议。
    # scheme 不覆盖 endpoint 自身协议，但仍用于未带协议的 domain；未配 domain 时 DIRECT URL 沿用生效 endpoint 的协议。
    endpoint: http://192.168.56.104:9000
    # accessKey 是访问密钥 ID；secretKey 是配对的访问密钥 Secret。
    accessKey: SZADMIN
    secretKey: Sz2026@123456
    # OSS scene 未单独指定 bucket 时使用的默认桶。
    bucketName: szadmin
  # 业务资源场景配置
  resource:
    # LOCAL 存储的磁盘根目录，文件物理路径为 root/objectKey，objectKey 以场景 path 为前缀。
    root: ./data
    # 本地开发临时文件服务，未配置时默认关闭；本环境显式开启，实际是否注册仅由 enabled 决定。
    # 匿名读取 LOCAL DIRECT 文件，不影响上传；部署环境请使用 Nginx 并配置实际 base-url。
    dev-file-server:
      enabled: true
    security:
      # 全局允许上传的扩展名白名单；scene.exts 只能在此范围内进一步收窄。
      allowed-exts: [ jpg, jpeg, png, gif, bmp, webp, svg, ico, pdf, doc, docx, xls, xlsx, ppt, pptx, rtf, txt, csv, zip, rar, 7z, tar, gz, mp3, wav, ogg, mp4, mov, avi, wmv ]
      # 全局单文件大小上限，使用与场景相同的 DataSize 格式（如 50MB、512KB、1GB）；未配时默认 50MB。
      # 两处均建议显式写单位，支持 B/KB/MB/GB/TB；未带单位的数字均按字节解析。
      max-size: 50MB
    scenes:
      # ========= 账户头像 - 本地模式 =========
      - code: admin.user.logo # 账户头像
        type: LOCAL
        serve-mode: DIRECT
        # base-url: http://127.0.0.1:7980/providers # nginx 代理
        base-url: /api/admin/resource/file/logo # 独立开发文件服务，需开启 dev-file-server
        # base-url: http://127.0.0.1:9991/api/admin/resource/file/logo # 独立开发文件服务，需开启 dev-file-server
        path: logo
        naming: ORIGINAL
        path-strategy: BIZ_DATE
        exts: [ svg, png, jpg, jpeg, webp, gif ]
        max-size: 3MB
      # ========= 账户头像 - OSS PRESIGNED（临时签名访问，无需 base-url） =========
      #      - code: admin.user.logo # 账户头像
      #        type: OSS
      #        serve-mode: PRESIGNED
      #        naming: ORIGINAL
      #        path-strategy: BIZ_DATE
      #        exts: [svg, png, jpg, jpeg, webp, gif]
      #        max-size: 3MB
      # ========= 账户头像 - OSS DIRECT（公开访问） =========
#      - code: admin.user.logo # 账户头像
#        name: 账户头像
#        type: OSS
#        serveMode: PRESIGNED
#        # 访问模式：DIRECT 明文直接访问（显式公开）；PROTECTED 受保护业务访问（默认）；PRESIGNED 有时效的临时访问，到期后时效无法访问。头像大部分业务中使用 DIRECT 公开访问即可；PRESIGNED 临时访问亦可；PROTECTED 需使用流blob式响应，不建议使用。
#        serve-mode: DIRECT
#        naming: UUID
#        path-strategy: BIZ_DATE
#        exts: [ svg, png, jpg, jpeg, webp, gif ]
#        max-size: 3MB
      # ========= 模板文件 - LOCAL PROTECTED（经业务接口下载/预览，无需 base-url） =========
      - code: template.excel
        name: 模板文件管理 / 导入模板
        type: LOCAL
        serve-mode: PROTECTED
        path: template
        naming: ORIGINAL
        path-strategy: DATE
        exts: [ xls, xlsx ]
        max-size: 10MB
      # ========= 教师统计 - 附件 - LOCAL PROTECTED（经业务接口下载/预览，无需 base-url） =========
      - code: teacher.attachment
        name: 教师统计 / 附件
        type: LOCAL
        serve-mode: PROTECTED
        path: teacher-attachments
        naming: ORIGINAL
        path-strategy: BIZ_DATE
        exts: [ png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx ]
        max-size: 10MB
      # ========= 教师统计 - 富文本编辑器 - LOCAL DIRECT（同源独立开发文件服务） =========
      - code: teacher.richtext
        name: 教师富文本
        type: LOCAL
        serve-mode: DIRECT
        path: teacher-richtext
        # 也支持完整地址，例如 http://127.0.0.1:9991/api/admin/resource/file/teacher-richtext
        base-url: /api/admin/resource/file/teacher-richtext
        naming: UUID
        path-strategy: DATE
        exts: [ png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx ]
        max-size: 5MB
      # ========= 临时公开文件 - LOCAL DIRECT（保留旧场景兼容） =========
      - code: system.temp
        name: 临时公开文件
        type: LOCAL
        serve-mode: DIRECT
        path: temp
        # 也支持完整地址，例如 http://127.0.0.1:9991/api/admin/resource/file/temp
        base-url: /api/admin/resource/file/temp
        naming: ORIGINAL
        path-strategy: DATE
        exts: [ png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx ]
        max-size: 10MB
      # ========= 通用上传组件 / 代码生成器默认受保护附件 - LOCAL PROTECTED =========
      - code: system.protected
        name: 通用业务附件
        type: LOCAL
        serve-mode: PROTECTED
        path: protected
        naming: ORIGINAL
        path-strategy: DATE
        exts: [ png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx ]
        max-size: 10MB
      # ========= 富文本组件默认公开资源 =========
      - code: system.richtext
        name: 通用富文本资源
        type: LOCAL
        serve-mode: DIRECT
        path: richtext
        base-url: /api/admin/resource/file/richtext
        naming: UUID
        path-strategy: DATE
        exts: [ png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx ]
        max-size: 5MB
